<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Saathi">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Saathi — Dosti ka Social App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= AUTH SCREEN ================= -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">💙</div>
      <h1 class="auth-title">Saathi</h1>
      <p class="auth-tagline">Dosti, posts aur private chats — sab ek jagah.</p>

      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">Login</button>
        <button id="tabSignup" class="auth-tab" type="button">Sign Up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <input type="text" id="signupName" placeholder="Full name" required maxlength="50">
        <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
        <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" required minlength="6" autocomplete="new-password">
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
    </div>
  </div>

  <!-- ================= APP SHELL ================= -->
  <div id="appScreen" class="hidden">
    <header id="topbar">
      <div class="topbar-inner">
        <span class="topbar-logo" data-action="nav" data-target="#/home">Saathi</span>
        <span class="topbar-actions">
        <button class="icon-btn" data-action="nav" data-target="#/chats" title="Messages">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 3-9 9M22 3l-6 18-3-7-7-3z"/></svg>
        </button>
        <button class="icon-btn" id="notifBtn" data-action="open-notifs" title="Notifications">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 3.5a5.5 5.5 0 0 0-4.5 2.3A5.5 5.5 0 0 0 7.5 3.5 5.5 5.5 0 0 0 2 9c0 6 10 11 10 11s10-5 10-11a5.5 5.5 0 0 0-5.5-5.5z"/></svg>
          <span id="notifBadge" class="badge hidden"></span>
        </button>
        </span>
      </div>
    </header>

    <div id="layout">
      <aside id="leftbar" class="sidebar"></aside>
      <main id="view"></main>
      <aside id="rightbar" class="sidebar"></aside>
    </div>

    <nav id="bottomnav">
      <button class="nav-item" data-action="nav" data-target="#/home" title="Home"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg></button>
      <button class="nav-item" data-action="nav" data-target="#/reels" title="Reels"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 9 6 3-6 3z"/></svg></button>
      <button class="nav-item" data-action="nav" data-target="#/search" title="Search"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="nav-item nav-add" data-action="open-create" title="Create"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg></button>
      <button class="nav-item" data-action="nav" data-target="#/chats" title="Messages"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 3-9 9M22 3l-6 18-3-7-7-3z"/></svg><span id="chatBadge" class="badge hidden"></span></button>
      <button class="nav-item" data-action="nav" data-target="#/profile" title="Profile"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.2-5 8-5s6.5 1.5 8 5"/></svg></button>
    </nav>

    <aside id="notifPanel" class="notif-panel hidden">
      <div class="notif-head"><strong>Notifications</strong><button class="icon-btn" data-action="close-notifs">✕</button></div>
      <div class="seg-tabs" id="notifFilters">
        <button class="chip active" data-action="notif-filter" data-tab="all">All</button>
        <button class="chip" data-action="notif-filter" data-tab="request">Friends</button>
        <button class="chip" data-action="notif-filter" data-tab="like">Likes</button>
        <button class="chip" data-action="notif-filter" data-tab="comment">Comments</button>
      </div>
      <div id="notifList"></div>
    </aside>
    <div id="storyViewer" class="story-viewer hidden">
      <button class="story-close" data-action="close-story">✕</button>
      <div id="storyBody"></div>
    </div>
    <div id="igSheet" class="modal-overlay hidden">
      <div class="modal-sheet" id="igSheetCard"></div>
    </div>
  </div>

  <!-- ================= COMPOSE MODAL ================= -->
  <div id="composeModal" class="modal-overlay hidden">
    <div class="modal-sheet">
      <div class="modal-head">
        <strong id="composeTitle">New post</strong>
        <button class="icon-btn" data-action="close-compose">✕</button>
      </div>
      <div id="composeUser" class="compose-user"></div>
      <textarea id="composeText" rows="4" placeholder="What's on your mind?" maxlength="2000"></textarea>
      <div id="composePreview" class="compose-preview hidden">
        <img id="composePreviewImg" alt="preview">
        <button class="preview-remove" data-action="remove-compose-image">✕</button>
      </div>
      <div class="compose-privacy" id="privacyChips">
        <button class="chip active" data-action="set-privacy" data-privacy="public">🌍 Public</button>
        <button class="chip" data-action="set-privacy" data-privacy="friends">👥 Friends</button>
        <button class="chip" data-action="set-privacy" data-privacy="close">⭐ Close Friends</button>
        <button class="chip" data-action="set-privacy" data-privacy="private">🔒 Only Me</button>
      </div>
      <div class="compose-song" id="composeSongBlock">
        <div class="compose-song-label">Song for reel</div>
        <div id="songChips" class="compose-privacy">
          <button class="chip active" type="button" data-action="pick-song" data-song="none">No song</button>
          <button class="chip" type="button" data-action="pick-song" data-song="raat">Raat</button>
          <button class="chip" type="button" data-action="pick-song" data-song="dholak">Dholak</button>
          <button class="chip" type="button" data-action="pick-song" data-song="mehfil">Mehfil</button>
          <button class="chip" type="button" data-action="pick-song" data-song="breeze">Breeze</button>
        </div>
        <label class="btn btn-light">
          Your clip
          <input type="file" id="composeSong" accept="audio/*" hidden>
        </label>
        <span id="composeSongName" class="user-row-sub"></span>
      </div>
      <div class="compose-actions">
        <label class="btn btn-light">
          📷 Photo
          <input type="file" id="composeImage" accept="image/*" hidden>
        </label>
        <button class="btn btn-primary" id="postBtn" data-action="submit-post">Post</button>
      </div>
    </div>
  </div>

  <!-- ================= EDIT PROFILE MODAL ================= -->
  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-sheet">
      <div class="modal-head">
        <strong>Edit Profile</strong>
        <button class="icon-btn" data-action="close-edit">✕</button>
      </div>
      <div class="edit-avatar-row">
        <div id="editAvatarPreview" class="avatar avatar-lg"></div>
        <label class="btn btn-light">📷 Change<input type="file" id="editAvatarInput" accept="image/*" hidden></label>
      </div>
      <input type="text" id="editName" placeholder="Full name" maxlength="50">
      <input type="text" id="editBio" placeholder="Bio (e.g. Arts Hindi Medium)" maxlength="100">
      <input type="text" id="editLocation" placeholder="Location (e.g. Bihar)" maxlength="50">
      <button class="btn btn-primary btn-block" data-action="save-profile">Save</button>
    </div>
  </div>

  <input type="file" id="avatarQuickInput" accept="image/*" hidden>
  <input type="file" id="chatImageInput" accept="image/*" hidden>
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
